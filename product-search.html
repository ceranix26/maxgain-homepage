<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>제품 검색 | MAXGAIN SYSTEMS</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/product-search.css">
</head>

<body>
    <header class="header">
        <div class="container nav"><a class="brand" href="index.html"><img src="assets/images/maxgain-logo.png"
                    alt="MAXGAIN SYSTEMS"></a><button class="menu-btn" aria-label="메뉴 열기"
                aria-expanded="false">☰</button>
            <nav class="nav-links"><a href="about.html" data-ko="회사소개" data-en="About">회사소개</a><a
                    href="manufacturers.html" data-ko="제조사" data-en="Manufacturers">제조사</a><a href="product-search.html"
                    data-ko="제품 검색" data-en="Product Search">제품 검색</a><a href="resources.html" data-ko="자료실"
                    data-en="Resources">자료실</a><a href="contact.html" data-ko="문의" data-en="Contact">문의</a>
                <div class="lang"><button class="active" data-lang="ko">KO</button><button data-lang="en">EN</button>
                </div>
            </nav>
        </div>
    </header>
    <main>
        <section class="subhero">
            <div class="container">
                <div class="breadcrumb">HOME / PRODUCT SEARCH</div>
                <h1 data-ko="제품 검색" data-en="Product Search">제품 검색</h1>
                <p data-ko="Part Number, 제조사 및 제품군을 기준으로 검색하고 현재 재고 상태를 확인합니다."
                    data-en="Search by part number, manufacturer or category and check current stock status.">Part
                    Number, 제조사 및 제품군을 기준으로 검색하고 현재 재고 상태를 확인합니다.</p>
            </div>
        </section>
        <section class="section soft">
            <div class="container">
                <div class="form">
                    <div class="form-grid">
                        <div class="field"><label>Keyword</label><input id="keyword"
                                placeholder="Part Number / Manufacturer / Category"></div>
                        <div class="field"><label>Category</label><select id="category">
                                <option value="">All</option>
                                <option>Capacitors</option>
                                <option>Resistors</option>
                                <option>Inductors</option>
                                <option>Transformers</option>
                                <option>RF Components</option>
                            </select></div>
                        <div class="field full"><button class="btn btn-primary" id="searchBtn" type="button"
                                data-ko="제품 검색" data-en="Search Products">제품 검색</button></div>
                    </div>
                </div>
                <div id="results" class="grid-3" style="margin-top:28px"></div>
                <p id="stockUpdated" class="stock-updated"></p>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <div class="legal"><span>© 2026 MAXGAIN SYSTEMS. All rights reserved.</span></div>
        </div>
    </footer>
    <script src="assets/js/main.js"></script>
    <script>
        let products = [], inventory = { items: {} };
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        async function load() { [products, inventory] = await Promise.all([fetch('data/products.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []), fetch('data/inventory-status.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : ({ items: {} })).catch(() => ({ items: {} }))]); run(); const el = document.getElementById('stockUpdated'); el.textContent = inventory.updatedAt ? `재고 기준: ${new Date(inventory.updatedAt).toLocaleString('ko-KR')}` : '재고 정보가 아직 동기화되지 않았습니다.'; }
        function run() { const k = document.getElementById('keyword').value.trim().toLowerCase(), c = document.getElementById('category').value; const list = products.filter(p => p.status === 'Published' && (!c || p.category === c) && (!k || JSON.stringify(p).toLowerCase().includes(k))); document.getElementById('results').innerHTML = list.length ? list.map(p => { const stock = inventory.items?.[p.partNumber]; const cls = stock?.status === 'in-stock' ? 'stock-in' : stock?.status === 'out-of-stock' ? 'stock-out' : 'stock-unknown'; const label = stock?.label || '재고 확인 중'; return `<article class="card search-result-card"><h3>${esc(p.partNumber)}</h3><p>${esc(p.manufacturer)} · ${esc(p.category)}${p.subcategory ? ' / ' + esc(p.subcategory) : ''}</p><p>${esc(p.primarySpec || '')}</p><span class="stock-badge ${cls}">${esc(label)}</span></article>` }).join('') : '<div class="notice">검색 결과가 없습니다.</div>'; }
        document.getElementById('searchBtn').onclick = run; document.getElementById('keyword').addEventListener('keydown', e => { if (e.key === 'Enter') run() }); load();
    </script>
</body>

</html>
